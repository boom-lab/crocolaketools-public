# Cluster settings for the test suite, sized for CI.
#
# Every dataset key from cluster.example.yaml is repeated here: a config
# directory must cover all the datasets its datasets.yaml declares.
# Field names must be arguments to dask's LocalCluster Client
#  (https://docs.dask.org/en/stable/deploying-python.html)


# Test settings for all datasets
TESTS:
    threads_per_worker: 1
    n_workers: 1
    memory_limit: '2GB'
    processes: True

# Multiworker and multithread test settings
TESTS_MULTIWORKER:
    threads_per_worker: 2
    n_workers: 2
    memory_limit: '2GB'
    processes: True

# add here if special cases are needed, remember to update test files
# accordingly (e.g. GOLDEN_REGISTRY in golden_registry.py; dask_client in
# test_golden.test_golden_argo_gdac)


